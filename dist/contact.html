<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design Agency</title>
    <link rel="stylesheet" href="output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script defer src="script.js"></script>

</head>

<body class="font-['Poppins'] scroll-smooth">
    <div class="bg-white">
        <header class="bg-[#FCF8F1] bg-opacity-30">
            <div class="px-4 mx-auto sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-16 lg:h-20">
                <div class="flex-shrink-0">
                  <a href="/dist/index.html" title="" class="flex">
                    <h1 class="font-black">WEB DESIGN AGENCY</h1>
                  </a>
                </div>
                <div id="menu" class="hidden rounded-lg left-1/3 bg-[#f3f3f3] p-10 w-3/5 flex flex-col justify-center items-center gap-10 lg:gap-5  absolute top-16 lg:top-auto lg:w-auto lg:p-auto lg:bg-white lg:left-auto lg:relative lg:flex lg:flex-row lg:items-center lg:justify-center lg:space-x-10 z-auto">
                    <a href="/" title="" class="text-base text-black transition-all duration-200 hover:text-opacity-80">Projects</a>
                    <a href="/dist/about.html" title="about" class="text-base text-black transition-all duration-200 hover:text-opacity-80">About</a>
                    <a href="/dist/contact.html" title="contact" class="text-base text-black transition-all duration-200 hover:text-opacity-80">Contact</a>
                    <a href="#" title="" class="text-base text-black transition-all duration-200 hover:text-opacity-80">Pricing</a>
                    <a href="#" title="" class=" lg:hidden lg:inline-flex items-center justify-center px-5 py-2.5 text-base transition-all duration-200 hover:bg-yellow-300 hover:text-black focus:text-black focus:bg-yellow-300 font-semibold text-white bg-black rounded-full" role="button">
                        Get Started
                      </a>
                  </div>
            
                  <a href="#" title="" class="hidden lg:inline-flex items-center justify-center px-5 py-2.5 text-base transition-all duration-200 hover:bg-yellow-300 hover:text-black focus:text-black focus:bg-yellow-300 font-semibold text-white bg-black rounded-full" role="button">
                    Get Started
                  </a>
                
                <!-- Hamburger Button -->
                <button id="btn" type="button" class="inline-flex p-2 text-black transition-all duration-200 rounded-md lg:hidden focus:bg-gray-100 hover:bg-gray-100">
                  <!-- Hamburger Icon -->
                  <svg id="hamburger" class="block w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path>
                  </svg>
                  <!-- Close Icon -->
                  <svg id="close" class="hidden w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
          
                <!-- Menu -->
      
              </div>
            </div>
          </header>
        
        <section class="bg-[#FCF8F1] bg-opacity-30 py-10 sm:py-16 lg:py-24">
            <div class="px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">
                <div class="max-w-2xl mx-auto text-center">
                    <h1 class="text-4xl font-bold text-black sm:text-6xl">Get in Touch</h1>
                    <p class="mt-4 text-lg text-gray-600">We'd love to hear from you. Please fill out the form below.</p>
                </div>

                <div class="max-w-xl mx-auto mt-12">
                    <form action="#" method="POST" class="space-y-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                            <input type="text" id="name" name="name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" id="email" name="email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2">
                        </div>
                        <div>
                            <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
                            <textarea id="message" name="message" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-black text-white rounded-full px-6 py-3 hover:bg-yellow-300 hover:text-black transition-all duration-200">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </div>
</body>
